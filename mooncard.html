<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoonCard · crea tu tarjeta de presentación · Moonlight Team</title>
<meta name="description" content="MoonCard: diseña tu propia tarjeta de presentación con el ambiente de Moonlight. Elige tipografía, colores, foto de tu personaje y adornos, y descárgala como imagen.">
<link rel="canonical" href="https://gtalex1.github.io/moonlight-team/mooncard.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moonlight Team">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="MoonCard · crea tu tarjeta de presentación · Moonlight Team">
<meta property="og:description" content="MoonCard: diseña tu propia tarjeta de presentación con el ambiente de Moonlight. Elige tipografía, colores, foto de tu personaje y adornos, y descárgala como imagen.">
<meta property="og:url" content="https://gtalex1.github.io/moonlight-team/mooncard.html">
<meta property="og:image" content="https://gtalex1.github.io/moonlight-team/luna.jpg">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@600&family=Playfair+Display:ital,wght@1,600&family=Dancing+Script:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{ max-width:900px; }
  #cardPanel{ padding:14px; }
  #card{ display:block; width:100%; height:auto; border-radius:10px; box-shadow:0 10px 34px rgba(0,0,0,.45); }
  .cc-note{ margin:10px 4px 0; font-size:.92rem; color:var(--ink-soft); }
  .f{ margin-bottom:16px; }
  .f > label{ display:block; margin-bottom:5px; color:var(--ink-soft); font-size:.95rem; }
  .f input[type=text], .f textarea, .f select{ width:100%; }
  .f textarea{ min-height:76px; resize:vertical; font-family:'Crimson Pro',serif; font-size:1rem; padding:8px 10px; border:1px solid var(--border); border-radius:3px; background:rgba(255,255,255,0.04); color:var(--ink); }
  .f select{ font-family:'Crimson Pro',serif; font-size:1rem; padding:8px 10px; border:1px solid var(--border); border-radius:3px; background:#1a2146; color:var(--ink); }
  .f input[type=range]{ width:100%; padding:0; }
  .f input[type=color]{ width:100%; height:40px; padding:2px; cursor:pointer; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .seg{ display:flex; gap:8px; }
  .seg button, .mini{ flex:1; font-family:'Crimson Pro',serif; font-size:.98rem; padding:7px 8px; border:1px solid var(--border); border-radius:3px; background:rgba(255,255,255,0.04); color:var(--ink-soft); cursor:pointer; transition:all .15s; }
  .seg button:hover, .mini:hover{ border-color:var(--gold-dim); }
  .seg button.on{ border-color:var(--gold); color:var(--gold); background:rgba(217,195,131,.12); }
  .mini{ flex:0 0 auto; }
  .sw{ display:flex; gap:10px; flex-wrap:wrap; }
  .sw button{ width:40px; height:40px; border-radius:50%; border:2px solid var(--border); cursor:pointer; padding:0; }
  .sw button.on{ border-color:var(--gold); box-shadow:0 0 12px rgba(217,195,131,.5); }
  .stk{ display:flex; gap:6px; flex-wrap:wrap; }
  .stk button{ font-size:1.4rem; width:44px; height:44px; border:1px solid var(--border); border-radius:6px; background:rgba(255,255,255,0.04); cursor:pointer; }
  .stk button:hover{ border-color:var(--gold); }
  .acts{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
  .chk{ display:flex; align-items:center; gap:8px; }
  .chk input{ width:auto; margin:0; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>

<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap"><h1>MoonCard</h1></div>
      <p class="subtitle">Crea tu tarjeta de presentación bajo la luna. Todo se queda en tu navegador: no se sube nada.</p>
    </div>
  </header>

  <section class="panel" id="cardPanel">
    <canvas id="card" width="1000" height="620" aria-label="Vista previa de tu MoonCard"></canvas>
    <p class="cc-note">Arrastra los adornos con el dedo o el ratón para colocarlos donde quieras.</p>
  </section>

  <section class="panel">
    <h2>Diseña tu tarjeta</h2>

    <div class="f"><label for="iNombre">Nombre</label><input id="iNombre" type="text" maxlength="24" value="Tu nombre" autocomplete="off"></div>
    <div class="f"><label for="iSub">Personaje o rol</label><input id="iSub" type="text" maxlength="40" value="Tu personaje o rol" autocomplete="off"></div>
    <div class="f"><label for="iBio">Sobre ti</label><textarea id="iBio" maxlength="160">Cuéntanos un poco de ti bajo la luna…</textarea></div>

    <div class="f">
      <label>Imagen de tu personaje</label>
      <div class="acts" style="margin-top:0">
        <button class="mini" id="bFoto" type="button">Elegir imagen</button>
        <button class="mini" id="bFotoQ" type="button">Quitar</button>
        <input type="file" id="iFoto" accept="image/*" hidden>
      </div>
      <p class="cc-note" style="margin:6px 0 0">Usa una imagen de tu personaje, no una foto tuya.</p>
    </div>
    <div class="row2">
      <div class="f"><label>Forma</label><div class="seg" id="sShape"><button type="button" data-v="circle" class="on">Círculo</button><button type="button" data-v="square">Cuadrado</button></div></div>
      <div class="f"><label for="iZoom">Zoom de la imagen</label><input id="iZoom" type="range" min="1" max="3" step="0.05" value="1"></div>
    </div>

    <div class="f"><label for="iFont">Tipografía del nombre</label><select id="iFont"></select></div>
    <div class="f"><label for="iSize">Tamaño del nombre</label><input id="iSize" type="range" min="36" max="110" value="76"></div>
    <div class="row2">
      <div class="f"><label for="iCName">Color del nombre</label><input id="iCName" type="color" value="#eef0fb"></div>
      <div class="f"><label for="iCAcc">Color de los detalles</label><input id="iCAcc" type="color" value="#d9c383"></div>
    </div>

    <div class="f"><label>Fondo</label><div class="sw" id="swatches"></div></div>

    <div class="f">
      <label>Adornos</label>
      <div class="stk" id="stk"></div>
      <div class="row2" style="margin-top:10px">
        <div><label for="iStSize" style="color:var(--ink-soft);font-size:.95rem">Tamaño del adorno seleccionado</label><input id="iStSize" type="range" min="30" max="180" value="70" style="width:100%;padding:0"></div>
        <div class="acts" style="align-items:flex-end"><button class="mini" id="bStDel" type="button">Quitar seleccionado</button><button class="mini" id="bStClr" type="button">Quitar todos</button></div>
      </div>
    </div>

    <div class="f chk"><input id="iTag" type="checkbox" checked><label for="iTag" style="margin:0">Mostrar «Moonlight Team» en la tarjeta</label></div>

    <div class="acts">
      <button class="btn-primary" id="bDown" type="button">Descargar imagen</button>
      <button class="btn-ghost" id="bReset" type="button">Empezar de nuevo</button>
    </div>
    <p class="cc-note" id="msg"></p>
  </section>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var W = 1000, H = 620;
  var FONTS = [
    { n:'Cormorant (elegante)', f:'Cormorant', s:'italic 600' },
    { n:'Crimson Pro (clásica)', f:'Crimson Pro', s:'600' },
    { n:'Cinzel (épica)', f:'Cinzel', s:'600' },
    { n:'Playfair Display (cursiva)', f:'Playfair Display', s:'italic 600' },
    { n:'Dancing Script (manuscrita)', f:'Dancing Script', s:'700' },
    { n:'Great Vibes (caligrafía)', f:'Great Vibes', s:'400' }
  ];
  var THEMES = [
    { n:'Noche', a:'#0e1326', b:'#090c1a', glow:'#d9c383', star:'255,255,255', name:'#eef0fb', acc:'#d9c383', ink:'#cdd3ee' },
    { n:'Aurora', a:'#0b2230', b:'#08121f', glow:'#6ee7d8', star:'220,255,250', name:'#e9fffb', acc:'#6ee7d8', ink:'#c9ece8' },
    { n:'Atardecer', a:'#2b1320', b:'#130a14', glow:'#ff9e5a', star:'255,235,220', name:'#fff1e6', acc:'#ffb072', ink:'#f0d9c8' },
    { n:'Sakura', a:'#2a1230', b:'#170a21', glow:'#ff8fb3', star:'255,225,240', name:'#ffeef5', acc:'#ff9fc0', ink:'#efd3e0' },
    { n:'Bosque', a:'#0c1f1a', b:'#07120f', glow:'#8fe3a0', star:'225,255,230', name:'#effff2', acc:'#8fe3a0', ink:'#cfe8d4' },
    { n:'Pergamino', a:'#f3ecdc', b:'#e3d8bd', glow:'#c9a24a', star:'', name:'#2a2438', acc:'#9a7424', ink:'#4a4258' }
  ];
  var ICONS = ['🌙','✦','⭐','🌸','❄️','🔥','⚡','🍃','💧','☁️','🦋','👑'];
  var DEF = function(){ return { nombre:'Tu nombre', sub:'Tu personaje o rol', bio:'Cuéntanos un poco de ti bajo la luna…', font:0, size:76, nameColor:THEMES[0].name, accent:THEMES[0].acc, theme:0, shape:'circle', zoom:1, tag:true, img:null, stickers:[], sel:-1 }; };
  var S = DEF();

  // ---------- Estrellas del fondo de la página ----------
  (function(){ var l = $('starsLayer'), n = innerWidth < 480 ? 24 : 40, fr = document.createDocumentFragment();
    for (var i = 0; i < n; i++){ var s = document.createElement('span'); s.className = 'star'; var z = (Math.random() * 1.6 + .8).toFixed(2);
      s.style.top = (Math.random() * 100).toFixed(2) + '%'; s.style.left = (Math.random() * 100).toFixed(2) + '%'; s.style.width = z + 'px'; s.style.height = z + 'px';
      s.style.setProperty('--dur', (Math.random() * 3 + 2).toFixed(2) + 's'); s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
      s.style.setProperty('--o-min', (Math.random() * .2 + .15).toFixed(2)); s.style.setProperty('--o-max', (Math.random() * .3 + .7).toFixed(2)); fr.appendChild(s); }
    l.appendChild(fr); })();

  // ---------- Dibujo de la tarjeta ----------
  function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function wrapLines(c, text, maxW, maxLines){
    var out = [], paras = String(text).split('\n');
    for (var p = 0; p < paras.length; p++){
      var words = paras[p].split(/\s+/).filter(Boolean), line = '';
      if (!words.length){ out.push(''); continue; }
      for (var i = 0; i < words.length; i++){
        var t = line ? line + ' ' + words[i] : words[i];
        if (c.measureText(t).width > maxW && line){ out.push(line); line = words[i]; } else line = t;
      }
      out.push(line);
    }
    if (out.length > maxLines){ out = out.slice(0, maxLines); var last = out[maxLines - 1]; while (last.length > 1 && c.measureText(last + '…').width > maxW) last = last.slice(0, -1); out[maxLines - 1] = last.trim() + '…'; }
    return out;
  }
  function draw(c, preview){
    var th = THEMES[S.theme], F = FONTS[S.font], acc = S.accent;
    var bg = c.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, th.a); bg.addColorStop(1, th.b);
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    var gl = c.createRadialGradient(W * .86, 40, 0, W * .86, 40, 520); gl.addColorStop(0, th.glow + '40'); gl.addColorStop(1, th.glow + '00');
    c.fillStyle = gl; c.fillRect(0, 0, W, H);
    if (th.star){
      var seed = 4242, rnd = function(){ return (seed = (seed * 16807) % 2147483647) / 2147483647; };
      for (var i = 0; i < 90; i++){ c.fillStyle = 'rgba(' + th.star + ',' + (0.2 + rnd() * 0.7).toFixed(2) + ')'; c.beginPath(); c.arc(rnd() * W, rnd() * H, 0.6 + rnd() * 1.2, 0, 7); c.fill(); }
    }
    // marco
    c.lineWidth = 2; c.strokeStyle = acc; c.globalAlpha = .6; rr(c, 18, 18, W - 36, H - 36, 18); c.stroke();
    c.globalAlpha = .2; c.lineWidth = 1; rr(c, 30, 30, W - 60, H - 60, 12); c.stroke(); c.globalAlpha = 1;
    // imagen
    var px = 70, py = 150, ps = 320, cx = px + ps / 2, cy = py + ps / 2;
    c.save();
    if (S.shape === 'circle'){ c.beginPath(); c.arc(cx, cy, ps / 2, 0, 7); } else rr(c, px, py, ps, ps, 26);
    c.shadowColor = acc + '66'; c.shadowBlur = 24; c.fillStyle = 'rgba(255,255,255,0.06)'; c.fill(); c.shadowBlur = 0;
    c.clip();
    if (S.img){
      var sc = Math.max(ps / S.img.width, ps / S.img.height) * S.zoom;
      c.drawImage(S.img, cx - S.img.width * sc / 2, cy - S.img.height * sc / 2, S.img.width * sc, S.img.height * sc);
    } else { c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = '110px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif'; c.globalAlpha = .55; c.fillText('🌙', cx, cy + 6); c.globalAlpha = 1; }
    c.restore();
    c.lineWidth = 4; c.strokeStyle = acc;
    if (S.shape === 'circle'){ c.beginPath(); c.arc(cx, cy, ps / 2, 0, 7); } else rr(c, px, py, ps, ps, 26);
    c.stroke();
    // textos
    var tx = 450, maxW = W - tx - 70;
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    var sz = S.size; c.font = F.s + ' ' + sz + 'px "' + F.f + '", serif';
    while (sz > 28 && c.measureText(S.nombre || ' ').width > maxW){ sz -= 2; c.font = F.s + ' ' + sz + 'px "' + F.f + '", serif'; }
    c.fillStyle = S.nameColor; c.fillText(S.nombre, tx, 235);
    c.font = 'italic 500 30px "Cormorant", serif'; c.fillStyle = acc; c.fillText(S.sub, tx, 282, maxW);
    // adorno divisor
    c.strokeStyle = acc; c.globalAlpha = .6; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(tx, 316); c.lineTo(tx + maxW * .42, 316); c.stroke();
    c.beginPath(); c.moveTo(tx + maxW * .58, 316); c.lineTo(tx + maxW, 316); c.stroke(); c.globalAlpha = 1;
    c.fillStyle = acc; c.beginPath(); c.moveTo(tx + maxW * .5, 307); c.lineTo(tx + maxW * .5 + 9, 316); c.lineTo(tx + maxW * .5, 325); c.lineTo(tx + maxW * .5 - 9, 316); c.closePath(); c.fill();
    c.font = '400 25px "Crimson Pro", serif'; c.fillStyle = th.ink;
    var ls = wrapLines(c, S.bio, maxW, 5);
    for (var j = 0; j < ls.length; j++) c.fillText(ls[j], tx, 372 + j * 36);
    if (S.tag){ c.textAlign = 'right'; c.font = 'italic 500 24px "Cormorant", serif'; c.fillStyle = acc; c.globalAlpha = .85; c.fillText('Moonlight Team 🌙', W - 56, H - 50); c.globalAlpha = 1; c.textAlign = 'left'; }
    // adornos
    for (var k = 0; k < S.stickers.length; k++){
      var st = S.stickers[k];
      c.font = st.size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = acc; c.fillText(st.sym, st.x, st.y);
      if (preview && k === S.sel){ c.strokeStyle = acc; c.lineWidth = 2; c.setLineDash([6, 6]); c.beginPath(); c.arc(st.x, st.y, st.size * .62, 0, 7); c.stroke(); c.setLineDash([]); }
    }
  }
  var cv = $('card'), ctx = cv.getContext('2d'), raf = 0;
  function redraw(){ if (raf) return; raf = requestAnimationFrame(function(){ raf = 0; draw(ctx, true); }); }
  function ensureFont(){ var F = FONTS[S.font]; return Promise.all([document.fonts.load(F.s + ' 40px "' + F.f + '"'), document.fonts.load('italic 500 30px "Cormorant"'), document.fonts.load('400 25px "Crimson Pro"')]).catch(function(){}); }

  // ---------- Controles ----------
  var sel = $('iFont'); FONTS.forEach(function(f, i){ var o = document.createElement('option'); o.value = i; o.textContent = f.n; sel.appendChild(o); });
  sel.onchange = function(){ S.font = +sel.value; ensureFont().then(redraw); };
  $('iNombre').oninput = function(){ S.nombre = this.value; redraw(); };
  $('iSub').oninput = function(){ S.sub = this.value; redraw(); };
  $('iBio').oninput = function(){ S.bio = this.value; redraw(); };
  $('iSize').oninput = function(){ S.size = +this.value; redraw(); };
  $('iCName').oninput = function(){ S.nameColor = this.value; redraw(); };
  $('iCAcc').oninput = function(){ S.accent = this.value; redraw(); };
  $('iZoom').oninput = function(){ S.zoom = +this.value; redraw(); };
  $('iTag').onchange = function(){ S.tag = this.checked; redraw(); };
  document.querySelectorAll('#sShape button').forEach(function(b){ b.onclick = function(){ S.shape = b.dataset.v; document.querySelectorAll('#sShape button').forEach(function(x){ x.classList.toggle('on', x === b); }); redraw(); }; });
  $('bFoto').onclick = function(){ $('iFoto').click(); };
  $('bFotoQ').onclick = function(){ S.img = null; redraw(); };
  $('iFoto').onchange = function(e){
    var f = e.target.files[0]; e.target.value = ''; if (!f) return;
    createImageBitmap(f).then(function(b){ S.img = b; redraw(); }).catch(function(){ $('msg').textContent = 'No se pudo leer esa imagen, prueba con otra.'; });
  };
  var sw = $('swatches');
  THEMES.forEach(function(t, i){ var b = document.createElement('button'); b.type = 'button'; b.title = t.n; b.setAttribute('aria-label', 'Fondo ' + t.n);
    b.style.background = 'linear-gradient(135deg,' + t.a + ',' + t.glow + ')'; if (!i) b.className = 'on';
    b.onclick = function(){ S.theme = i; S.nameColor = t.name; S.accent = t.acc; $('iCName').value = t.name; $('iCAcc').value = t.acc; sw.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); }); redraw(); };
    sw.appendChild(b); });
  var stk = $('stk');
  ICONS.forEach(function(sym){ var b = document.createElement('button'); b.type = 'button'; b.textContent = sym; b.setAttribute('aria-label', 'Añadir adorno ' + sym);
    b.onclick = function(){ var n = S.stickers.length; S.stickers.push({ sym: sym, x: W / 2 + (n % 5) * 24 - 48, y: H / 2 + (n % 5) * 18 - 36, size: +$('iStSize').value }); S.sel = S.stickers.length - 1; cv.style.touchAction = 'none'; redraw(); };
    stk.appendChild(b); });
  $('iStSize').oninput = function(){ if (S.sel >= 0){ S.stickers[S.sel].size = +this.value; redraw(); } };
  $('bStDel').onclick = function(){ if (S.sel >= 0){ S.stickers.splice(S.sel, 1); S.sel = -1; if (!S.stickers.length) cv.style.touchAction = 'auto'; redraw(); } };
  $('bStClr').onclick = function(){ S.stickers = []; S.sel = -1; cv.style.touchAction = 'auto'; redraw(); };
  $('bReset').onclick = function(){ if (!confirm('¿Empezar de nuevo? Se pierde el diseño actual.')) return; S = DEF();
    $('iNombre').value = S.nombre; $('iSub').value = S.sub; $('iBio').value = S.bio; $('iSize').value = S.size; $('iZoom').value = 1; $('iFont').value = 0; $('iCName').value = S.nameColor; $('iCAcc').value = S.accent; $('iTag').checked = true;
    document.querySelectorAll('#sShape button').forEach(function(x, i){ x.classList.toggle('on', !i); }); sw.querySelectorAll('button').forEach(function(x, i){ x.classList.toggle('on', !i); }); cv.style.touchAction = 'auto'; ensureFont().then(redraw); };

  // arrastrar adornos sobre la tarjeta
  var drag = null;
  function pos(e){ var r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
  cv.addEventListener('pointerdown', function(e){
    var p = pos(e); S.sel = -1;
    for (var i = S.stickers.length - 1; i >= 0; i--){ var s = S.stickers[i]; if (Math.hypot(p.x - s.x, p.y - s.y) <= Math.max(26, s.size * .6)){ S.sel = i; drag = { dx: p.x - s.x, dy: p.y - s.y }; $('iStSize').value = s.size; try { cv.setPointerCapture(e.pointerId); } catch (x) {} break; } }
    redraw();
  });
  cv.addEventListener('pointermove', function(e){ if (!drag || S.sel < 0) return; var p = pos(e), s = S.stickers[S.sel]; s.x = Math.max(0, Math.min(W, p.x - drag.dx)); s.y = Math.max(0, Math.min(H, p.y - drag.dy)); redraw(); });
  ['pointerup', 'pointercancel'].forEach(function(t){ cv.addEventListener(t, function(){ drag = null; }); });

  // ---------- Descargar ----------
  $('bDown').onclick = function(){
    ensureFont().then(function(){
      var k = 2, out = document.createElement('canvas'); out.width = W * k; out.height = H * k;
      var c = out.getContext('2d'); c.scale(k, k); draw(c, false);
      out.toBlob(function(b){
        if (!b){ $('msg').textContent = 'No se pudo generar la imagen.'; return; }
        var a = document.createElement('a'), nm = (S.nombre || 'tarjeta').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'tarjeta';
        a.href = URL.createObjectURL(b); a.download = 'mooncard-' + nm + '.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        $('msg').textContent = 'Listo. Si la mandas por WhatsApp, envíala como Documento para que no se comprima.';
      }, 'image/png');
    });
  };

  ensureFont().then(redraw); redraw();
  if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', redraw);
})();
</script>
