<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árbol · Moonlight Team</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .wrap{ max-width:1100px; }
  #treeScroll{ overflow:auto; padding:26px 0 14px; -webkit-overflow-scrolling:touch; }
  #tree{ position:relative; margin:0 auto; }
  #tree .gl{ position:absolute; left:0; right:0; height:0; border-top:1px dotted rgba(197,209,255,0.2); }
  #tree .gl span{ position:absolute; left:4px; top:-19px; font-family:'Cormorant',serif; font-style:italic; letter-spacing:2px; font-size:0.85rem; color:var(--gold-dim); }
  #tree svg{ position:absolute; left:0; top:0; pointer-events:none; overflow:visible; }
  .e{ fill:none; stroke:var(--silver); stroke-width:1.6; opacity:.8; transition:opacity .2s; }
  .e.pt{ stroke:var(--gold-dim); stroke-dasharray:4 4; opacity:1; }
  .e.dim{ opacity:.12; }
  .n{
    position:absolute; z-index:2; padding:0 12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:1.5px solid var(--silver); border-radius:999px;
    background:rgba(16,22,48,.94); color:var(--ink);
    box-shadow:0 0 16px rgba(185,198,239,.10);
    cursor:pointer; transition:opacity .2s, box-shadow .2s, border-color .2s;
  }
  .n:hover{ border-color:var(--gold); }
  .n b{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:'Crimson Pro',serif; font-weight:600; font-size:1rem; line-height:1.15; }
  .n i{ margin-top:2px; font-family:'Cormorant',serif; font-size:.78rem; letter-spacing:1px; color:var(--ink-soft); }
  .n.sel{ border-color:var(--gold); box-shadow:0 0 18px rgba(217,195,131,.38); }
  .n.dim{ opacity:.28; }
  .n.gone{ border-style:dashed; opacity:.55; }
  .n.gone b{ font-style:italic; }
  #sheet{
    position:fixed; z-index:20; top:0; right:0; bottom:0; width:min(400px,100vw);
    background:#141b37; border-left:1px solid var(--border); box-shadow:-10px 0 30px rgba(0,0,0,.4);
    padding:22px 20px 28px; overflow:auto; transform:translateX(105%); transition:transform .28s ease;
  }
  #sheet.o{ transform:none; }
  #sheet .sh-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  #sheet h2{ font-family:'Cormorant',serif; font-style:italic; font-weight:600; font-size:1.7rem; color:var(--gold); margin:0 0 8px; }
  #sheet .x{ background:none; border:1px solid var(--border); color:var(--ink-soft); border-radius:3px; cursor:pointer; padding:2px 9px; font-size:1rem; }
  #sheet .rel{ margin:8px 0; color:var(--ink-soft); }
  #sheet .rel b{ color:var(--ink); font-weight:600; }
  #sheet a.go{ color:var(--gold); cursor:pointer; border-bottom:1px dotted var(--gold-dim); }
  #sheet .row-btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  #sheet .field{ margin-bottom:16px; }
  #sheet .field > label{ display:block; margin-bottom:4px; color:var(--ink-soft); font-size:.95rem; }
  #sheet select{ width:100%; }
  .msel-btn{ width:100%; display:flex; justify-content:space-between; align-items:center; gap:8px; text-align:left;
    font-family:'Crimson Pro',serif; font-size:1rem; padding:8px 10px; border:1px solid var(--border); border-radius:3px;
    background:rgba(255,255,255,0.04); color:var(--ink); cursor:pointer; }
  .msel-txt{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msel-list{ margin-top:4px; max-height:210px; overflow:auto; border:1px solid var(--border); border-radius:3px; background:rgba(255,255,255,0.03); padding:6px; }
  .msel-list .msel-q{ width:100%; margin-bottom:6px; }
  .msel-list label{ display:flex; align-items:center; gap:8px; padding:4px 4px; cursor:pointer; border-radius:3px; }
  .msel-list label:hover{ background:rgba(217,195,131,.10); }
  .msel-list input[type=checkbox]{ width:auto; margin:0; }
  @media (min-width:901px){ body:has(#sheet.o) .wrap{ padding-right:420px; } }
  @media (max-width:600px){
    #sheet{ top:auto; left:0; width:100%; height:62vh; border-left:0; border-top:1px solid var(--border); transform:translateY(105%); }
  }
</style>
</head>
<body>

<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="shooting-star" style="--top:8%; --left:80%; --dur:16s; --delay:2s" aria-hidden="true"></div>
<div class="shooting-star" style="--top:22%; --left:55%; --dur:22s; --delay:9s" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>

<div class="wrap">
  <a class="back-link" href="index.html">← Volver al índice</a>
  <header class="top">
    <div>
      <div class="title-wrap">
        <h1>Árbol de Moonlight</h1>
      </div>
      <p class="subtitle">Los lazos entre quienes comparten la noche. Toca un personaje para ver su familia.</p>
    </div>
    <div class="admin-actions">
      <button class="admin-toggle" id="adminToggleBtn">Acceso admin</button>
    </div>
  </header>

  <section class="panel">
    <div id="treeScroll"><div id="tree"></div></div>
    <p class="empty-note" id="emptyNote" hidden>Todavía no hay personajes en el árbol.</p>
    <p class="empty-note" id="statusLine"></p>
  </section>

</div>

<dialog id="loginDialog">
  <div class="dialog-inner">
    <h3>Acceso admin</h3>
    <div class="dialog-field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username">
    </div>
    <div class="dialog-field">
      <label for="loginPass">Contraseña</label>
      <input id="loginPass" type="password" autocomplete="current-password">
    </div>
    <p class="dialog-error" id="loginError"></p>
    <div class="dialog-actions">
      <button class="btn-primary" id="loginSubmit" type="button">Entrar</button>
      <button class="btn-ghost" id="loginCancel" type="button">Cancelar</button>
    </div>
  </div>
</dialog>

<aside id="sheet" aria-live="polite"></aside>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, doc, onSnapshot, writeBatch, arrayUnion, arrayRemove, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCJw3MuQQrYZ7xaabbKhK5Q4fAAB5xzZsk",
    authDomain: "moonlight-teamm-947ee.firebaseapp.com",
    projectId: "moonlight-teamm-947ee",
    storageBucket: "moonlight-teamm-947ee.firebasestorage.app",
    messagingSenderId: "664050217208",
    appId: "1:664050217208:web:194120b9ab73b43a984b0d"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const normalize = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();

  // ---------- Estrellas ----------
  (function paintStars(){
    const layer = $('starsLayer');
    const count = window.innerWidth < 480 ? 26 : 42;
    const frag = document.createDocumentFragment();
    for (let i = 0; i < count; i++){
      const s = document.createElement('span');
      s.className = 'star';
      const size = (Math.random() * 1.6 + 0.8).toFixed(2);
      s.style.top = (Math.random() * 100).toFixed(2) + '%';
      s.style.left = (Math.random() * 100).toFixed(2) + '%';
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.setProperty('--dur', (Math.random() * 3 + 2).toFixed(2) + 's');
      s.style.setProperty('--delay', (Math.random() * 5).toFixed(2) + 's');
      s.style.setProperty('--o-min', (Math.random() * 0.2 + 0.15).toFixed(2));
      s.style.setProperty('--o-max', (Math.random() * 0.3 + 0.7).toFixed(2));
      frag.appendChild(s);
    }
    layer.appendChild(frag);
  })();

  // ---------- Estado ----------
  let isAdmin = false, sel = null, syncing = false, SC = 1, editing = false;
  let ocupados = [], arbol = [];
  const loaded = { o: false, a: false };
  const ROM = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];

  // <pure>
  function buildPeople(arbolDocs){
    const vis = arbolDocs.filter(a => !a.fuera);
    const ids = new Set(vis.map(a => a.id));
    return vis.map(a => ({
      id: a.id, name: a.nombre || '?', g: a.genero || '',
      parents: (a.padres || []).filter(x => ids.has(x) && x !== a.id),
      partners: (a.parejas || []).filter(x => ids.has(x) && x !== a.id),
      ord: typeof a.orden === 'number' ? a.orden : 1e9
    }));
  }
  function gens(P){
    const g = {}; P.forEach(p => g[p.id] = 0);
    const by = {}; P.forEach(p => by[p.id] = p);
    for (let i = 0; i < 40; i++) P.forEach(p => {
      p.parents.forEach(x => { if (g[p.id] < g[x] + 1) g[p.id] = g[x] + 1; });
      p.partners.forEach(x => { if (g[p.id] < g[x]) g[p.id] = g[x]; });
      if (!p.parents.length){
        const k = P.filter(c => c.parents.includes(p.id));
        if (k.length){ const m = Math.min(...k.map(c => g[c.id])) - 1; if (g[p.id] < m) g[p.id] = m; }
      }
    });
    return g;
  }
  function layout(P, g, max, PX){
    const by = {}; P.forEach(p => by[p.id] = p);
    const rows = [], X = {};
    for (let i = 0; i <= max; i++){
      const ids = P.filter(p => g[p.id] === i).map(p => p.id), seen = new Set(), units = [];
      ids.forEach(id => {
        if (seen.has(id)) return;
        const u = [], st = [id];
        while (st.length){
          const x = st.pop(); if (seen.has(x)) continue;
          seen.add(x); u.push(x);
          by[x].partners.forEach(q => { if (ids.includes(q) && !seen.has(q)) st.push(q); });
        }
        units.push({ ids: u.sort((a, b) => by[a].ord - by[b].ord || ids.indexOf(a) - ids.indexOf(b)), c: 0, d: 0 });
      });
      rows.push(units);
    }
    const avg = a => a.reduce((s, v) => s + v, 0) / a.length;
    const place = us => {
      let prev = null;
      us.forEach(u => {
        const h = u.ids.length * PX / 2, min = prev === null ? -Infinity : prev + h;
        u.c = isFinite(u.c) ? Math.max(u.c, min) : (prev === null ? h : min);
        prev = u.c + h;
        u.ids.forEach((id, k) => X[id] = u.c + (k - (u.ids.length - 1) / 2) * PX);
      });
    };
    rows.forEach(us => {
      us.forEach(u => {
        const d = u.ids.flatMap(id => by[id].parents.filter(p => p in X).map(p => X[p]));
        u.d = d.length ? avg(d) : Infinity;
      });
      const ok = u => Math.min(...u.ids.map(i => by[i].ord));
      us.sort((a, b) => { const x = ok(a), y = ok(b); if (x !== y) return x < y ? -1 : 1; return a.d === b.d ? 0 : a.d < b.d ? -1 : 1; });
      us.forEach(u => u.c = isFinite(u.d) ? u.d : -Infinity);
      place(us);
    });
    for (let i = max - 1; i >= 0; i--){
      rows[i].forEach(u => {
        const d = u.ids.flatMap(id => P.filter(c => c.parents.includes(id)).map(c => X[c.id]));
        if (d.length) u.c = avg(d);
      });
      place(rows[i]);
    }
    return X;
  }
  // </pure>

  // ---------- Dibujo ----------
  function render(){
    const t = $('tree'), P = buildPeople(arbol);
    $('emptyNote').hidden = P.length > 0;
    if (!P.length){ t.innerHTML = ''; t.style.width = t.style.height = ''; return; }
    const by = {}; P.forEach(p => by[p.id] = p);
    const mob = innerWidth <= 600;
    const [W, H, PX, RH, LM] = mob ? [108, 48, 126, 100, 62] : [136, 54, 176, 124, 96];
    const g = gens(P), max = Math.max(0, ...Object.values(g)), X = layout(P, g, max, PX);
    const xs = P.map(p => X[p.id]);
    const sh = LM + W / 2 + 10 - Math.min(...xs), wd = Math.max(...xs) + sh + W / 2 + 30, ht = (max + 1) * RH + 30;
    const RY = i => 20 + i * RH + H / 2;
    const me = sel && by[sel];
    const nb = new Set(me ? [sel, ...me.parents, ...me.partners, ...P.filter(c => c.parents.includes(sel)).map(c => c.id)] : []);
    let gl = '', es = '', ns = '';
    for (let i = 0; i <= max; i++) gl += `<div class="gl" style="top:${RY(i)}px"><span>Gen. ${ROM[i] || i + 1}</span></div>`;
    P.forEach(c => c.parents.forEach(a => {
      const x1 = X[a] + sh, y1 = RY(g[a]) + H / 2, x2 = X[c.id] + sh, y2 = RY(g[c.id]) - H / 2, b = y2 - (RH - H) / 2;
      es += `<path class="e${me ? (a === sel || c.id === sel ? '' : ' dim') : ''}" d="M${x1} ${y1}V${b}H${x2}V${y2}" marker-end="url(#ar)"/>`;
    }));
    P.forEach(p => p.partners.forEach(q => {
      if (p.id < q && g[p.id] === g[q]){
        const l = X[p.id] < X[q] ? p.id : q, r = l === p.id ? q : p.id, y = RY(g[p.id]);
        es += `<line class="e pt${me ? (p.id === sel || q === sel ? '' : ' dim') : ''}" x1="${X[l] + sh + W / 2}" y1="${y}" x2="${X[r] + sh - W / 2}" y2="${y}"/>`;
      }
    }));
    P.forEach(p => {
      const cls = (p.id === sel ? ' sel' : me && !nb.has(p.id) ? ' dim' : '') + '';
      const sym = p.g === 'f' ? ' ♀' : p.g === 'm' ? ' ♂' : '';
      ns += `<div class="n${cls}" data-id="${esc(p.id)}" style="width:${W}px;height:${H}px;left:${X[p.id] + sh - W / 2}px;top:${RY(g[p.id]) - H / 2}px"><b>${esc(p.name)}</b><i>Gen. ${ROM[g[p.id]] || g[p.id] + 1}${sym}</i></div>`;
    });
    t.style.width = wd + 'px'; t.style.height = ht + 'px';
    SC = mob ? Math.max(.6, Math.min(1, ($('treeScroll').clientWidth - 8) / wd)) : 1;
    t.style.zoom = SC;
    t.innerHTML = gl + `<svg width="${wd}" height="${ht}"><defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b9c6ef"/></marker></defs>${es}</svg>` + ns;
    if (sel && by[sel]) showDetail(P, by); else { if (sel) sel = null; closeSheet(); }
  }

  $('tree').addEventListener('click', (e) => {
    const n = e.target.closest('.n');
    if (!n) return;
    editing = false;
    sel = sel === n.dataset.id ? null : n.dataset.id;
    render();
  });
  addEventListener('resize', () => { clearTimeout(render._t); render._t = setTimeout(render, 150); });

  // ---------- Ficha del personaje (panel lateral) ----------
  function closeSheet(){ editing = false; $('sheet').classList.remove('o'); }
  function showDetail(P, by){
    if (editing) return;
    const me = by[sel], sh = $('sheet');
    const link = (id) => `<a class="go" data-go="${esc(id)}">${esc(by[id].name)}</a>`;
    const list = (ids) => ids.length ? ids.map(link).join(', ') : '<span>—</span>';
    const hijos = P.filter(c => c.parents.includes(sel)).map(c => c.id);
    const hermanos = P.filter(q => q.id !== sel && q.parents.some(p => me.parents.includes(p))).map(q => q.id);
    sh.innerHTML = `<div class="sh-head"><h2>${esc(me.name)}</h2><button class="x" id="shX" type="button" aria-label="Cerrar">✕</button></div>` +
      `<p class="rel"><b>Padres:</b> ${list(me.parents)}</p>` +
      `<p class="rel"><b>Pareja:</b> ${list(me.partners)}</p>` +
      `<p class="rel"><b>Hijos:</b> ${list(hijos)}</p>` +
      `<p class="rel"><b>Hermanos:</b> ${list(hermanos)}</p>` +
      (isAdmin ? '<div class="row-btns"><button class="btn-primary" id="editBtn" type="button">Editar</button></div>' : '');
    sh.classList.add('o');
    $('shX').onclick = () => { sel = null; closeSheet(); render(); };
    sh.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => { sel = a.dataset.go; render(); }));
    if (isAdmin) $('editBtn').onclick = () => openEdit(P);
  }

  // ---------- Edición (solo admin) ----------
  function descendants(P, id){
    const out = new Set(), q = [id];
    while (q.length){ const x = q.pop(); P.filter(c => c.parents.includes(x)).forEach(c => { if (!out.has(c.id)){ out.add(c.id); q.push(c.id); } }); }
    return out;
  }
  function mselHtml(name, label, opts, chosen){
    return `<div class="field"><label>${label}</label><div class="msel" data-name="${name}">
      <button type="button" class="msel-btn"><span class="msel-txt"></span><span>▾</span></button>
      <div class="msel-list" hidden>${opts.length > 8 ? '<input type="text" class="msel-q" placeholder="Buscar…" autocomplete="off">' : ''}
      ${opts.map(o => `<label data-n="${esc(normalize(o.name))}"><input type="checkbox" value="${esc(o.id)}" ${chosen.includes(o.id) ? 'checked' : ''}>${esc(o.name)}</label>`).join('') || '<small>—</small>'}
      </div></div></div>`;
  }
  function wireMsel(root){
    root.querySelectorAll('.msel').forEach(m => {
      const list = m.querySelector('.msel-list'), txt = m.querySelector('.msel-txt'), q = m.querySelector('.msel-q');
      const upd = () => {
        const names = [...m.querySelectorAll('input[type=checkbox]:checked')].map(c => c.parentElement.textContent.trim());
        txt.textContent = names.length ? names.join(', ') : 'Elegir…';
      };
      m.querySelector('.msel-btn').onclick = () => { list.hidden = !list.hidden; if (!list.hidden && q) q.focus(); };
      m.addEventListener('change', upd);
      if (q) q.oninput = () => { const k = normalize(q.value); m.querySelectorAll('label[data-n]').forEach(l => l.hidden = !l.dataset.n.includes(k)); };
      upd();
    });
  }
  function openEdit(P){
    const me = P.find(p => p.id === sel); if (!me) return;
    editing = true;
    const desc = descendants(P, sel);
    const others = P.filter(p => p.id !== sel);
    const sh = $('sheet');
    sh.innerHTML = `<div class="sh-head"><h2>${esc(me.name)}</h2></div>
      <div class="field"><label for="edG">Género</label>
        <select id="edG"><option value="" ${!me.g ? 'selected' : ''}>Sin definir</option><option value="f" ${me.g === 'f' ? 'selected' : ''}>Femenino</option><option value="m" ${me.g === 'm' ? 'selected' : ''}>Masculino</option></select></div>
      ${mselHtml('pa', 'Padres / madres', others.filter(x => !desc.has(x.id)), me.parents)}
      ${mselHtml('pt', 'Pareja', others, me.partners)}
      <p class="dialog-error" id="editError"></p>
      <div class="row-btns"><button class="btn-primary" id="edSave" type="button">Guardar</button><button class="btn-ghost" id="edCancel" type="button">Cancelar</button></div>`;
    wireMsel(sh);
    $('edCancel').onclick = () => { editing = false; render(); };
    $('edSave').onclick = async () => {
      const vals = (n) => [...sh.querySelectorAll(`.msel[data-name=${n}] input[type=checkbox]:checked`)].map(e => e.value);
      const cur = arbol.find(x => x.id === sel) || {};
      const oculto = (id) => (arbol.find(x => x.id === id) || {}).fuera;
      const padres = vals('pa').concat((cur.padres || []).filter(oculto));
      const parejas = vals('pt').concat((cur.parejas || []).filter(oculto));
      try {
        const batch = writeBatch(db);
        batch.update(doc(db, 'arbol', sel), { genero: $('edG').value, padres, parejas });
        arbol.forEach(x => {
          if (x.id === sel) return;
          const had = (x.parejas || []).includes(sel), want = parejas.includes(x.id);
          if (had && !want) batch.update(doc(db, 'arbol', x.id), { parejas: arrayRemove(sel) });
          if (!had && want) batch.update(doc(db, 'arbol', x.id), { parejas: arrayUnion(sel) });
        });
        await batch.commit();
        editing = false; render();
      } catch (e) { $('editError').textContent = 'No se pudo guardar, inténtalo de nuevo.'; }
    };
  }

  // ---------- Un registro por cada personaje ocupado (lo hace el admin al entrar) ----------
  async function sha(txt){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  // Las fichas de quien se va quedan ocultas. Si el personaje vuelve a ocuparlo la misma persona
  // (mismo contacto) se reactiva con sus vínculos; si es otra, se reinicia como nueva.
  async function maybeSync(){
    if (!isAdmin || syncing || !loaded.o || !loaded.a) return;
    syncing = true;
    try {
      const owners = {};
      for (const o of ocupados) if (o.miembroId) owners[o.id] = await sha(String(o.miembroId));
      const batch = writeBatch(db), vivos = new Set();
      let n = 0;
      const lista = ocupados.slice().sort((a, b) => (a.orden ?? 1e9) - (b.orden ?? 1e9));
      lista.forEach((o, i) => {
        const own = owners[o.id] || '';
        const a = arbol.find(x => x.oid === o.id && !vivos.has(x.id))
          || arbol.find(x => normalize(x.nombre) === normalize(o.nombre) && !vivos.has(x.id));
        if (!a){
          batch.set(doc(collection(db, 'arbol')), { nombre: o.nombre, oid: o.id, dueno: own, genero: '', padres: [], parejas: [], fuera: false, orden: i, createdAt: serverTimestamp() });
          n++; return;
        }
        const ref = doc(db, 'arbol', a.id);
        if (a.oid === o.id && !a.fuera){
          vivos.add(a.id);
          const upd = {};
          if (own && a.dueno !== own) upd.dueno = own;
          if (a.nombre !== o.nombre) upd.nombre = o.nombre;
          if (Object.keys(upd).length){ batch.update(ref, upd); n++; }
          return;
        }
        // Personaje que vuelve a estar ocupado: ¿la misma persona?
        if (!own) return;                       // aún sin contacto vinculado: se espera
        vivos.add(a.id);
        if (a.dueno && a.dueno === own){
          batch.update(ref, { fuera: false, oid: o.id, nombre: o.nombre }); n++;
        } else {
          batch.update(ref, { fuera: false, oid: o.id, nombre: o.nombre, dueno: own, genero: '', padres: [], parejas: [] }); n++;
          arbol.forEach(x => {
            if (x.id === a.id) return;
            if ((x.padres || []).includes(a.id)) { batch.update(doc(db, 'arbol', x.id), { padres: arrayRemove(a.id) }); n++; }
            if ((x.parejas || []).includes(a.id)) { batch.update(doc(db, 'arbol', x.id), { parejas: arrayRemove(a.id) }); n++; }
          });
        }
      });
      if (lista.length) arbol.forEach(a => {
        if (!vivos.has(a.id) && !a.fuera && !lista.some(o => o.id === a.oid)){
          batch.update(doc(db, 'arbol', a.id), { fuera: true }); n++;
        }
      });
      if (n) await batch.commit();
      syncing = false;
      if (n) maybeSync();
    } catch (e) {
      syncing = false;
      $('statusLine').textContent = 'No se pudo sincronizar con la lista de ocupados.';
    }
  }

  onSnapshot(collection(db, 'ocupados'), (snap) => {
    ocupados = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.o = true; maybeSync();
  });
  onSnapshot(collection(db, 'arbol'), (snap) => {
    arbol = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loaded.a = true; maybeSync(); render();
  }, () => { $('statusLine').textContent = 'No se pudo cargar el árbol.'; });

  // ---------- Login admin ----------
  $('adminToggleBtn').addEventListener('click', () => {
    if (isAdmin) { signOut(auth); return; }
    $('loginError').textContent = ''; $('loginEmail').value = ''; $('loginPass').value = '';
    $('loginDialog').showModal();
  });
  $('loginCancel').addEventListener('click', () => $('loginDialog').close());
  $('loginSubmit').addEventListener('click', async () => {
    $('loginError').textContent = '';
    try { await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPass').value); $('loginDialog').close(); }
    catch (e) { $('loginError').textContent = 'Email o contraseña incorrectos.'; }
  });
  onAuthStateChanged(auth, (user) => {
    isAdmin = !!user;
    $('adminToggleBtn').textContent = isAdmin ? 'Salir del modo admin' : 'Acceso admin';
    $('adminToggleBtn').classList.toggle('is-admin', isAdmin);
    maybeSync(); render();
  });
</script>
</body>
</html>
