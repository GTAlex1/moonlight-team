<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista — Moonlight Team</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  select{width:100%;font-family:'Crimson Pro',serif;font-size:1rem;padding:8px 10px;border:1px solid var(--border);border-radius:3px;background:rgba(255,255,255,0.04);color:var(--ink)}
  select option{background:#151b34}
  .li-edit-form select{flex:1;min-width:110px;padding:6px 8px;font-size:0.92rem}
  .simple-list li.grupo{ flex-direction:column; align-items:stretch; gap:6px; }
  .req-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 0 6px 28px; border-top:1px dashed rgba(197,209,255,.14); }
  .lobby-text{ color:var(--ink-soft); margin:0 0 14px; }
  .lobby{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 12px; }
  .lobby-btn{ display:inline-block; padding:11px 22px; border:1px solid var(--gold); border-radius:4px; color:var(--gold); background:rgba(217,195,131,.10);
    font-family:'Crimson Pro',serif; font-size:1.1rem; text-decoration:none; letter-spacing:.3px; transition:background .2s, box-shadow .2s; }
  .lobby-btn:hover{ background:rgba(217,195,131,.2); box-shadow:0 0 18px rgba(217,195,131,.28); }
  .lobby-empty, .lobby-note{ color:var(--ink-soft); font-style:italic; font-size:.95rem; margin:0; }
  .lobby-admin{ display:flex; gap:8px; flex:1 1 100%; max-width:560px; }
  .lobby-admin input{ flex:1; min-width:0; }
  .lobby-note{ flex:1 1 100%; }
</style>
</head>
<body>

<div class="stars" id="starsLayer" aria-hidden="true"></div>
<div class="mist m1" aria-hidden="true"></div>
<div class="mist m2" aria-hidden="true"></div>
<div class="shooting-star" style="--top:8%; --left:80%; --dur:16s; --delay:2s" aria-hidden="true"></div>
<div class="shooting-star" style="--top:22%; --left:55%; --dur:22s; --delay:9s" aria-hidden="true"></div>
<div class="shooting-star" style="--top:4%; --left:35%; --dur:19s; --delay:14s" aria-hidden="true"></div>
